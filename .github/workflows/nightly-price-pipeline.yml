name: Nightly price pipeline

# The DAG: fetch -> validate -> store -> retrain -> publish. Each job step
# runs only if the previous one succeeded (GitHub Actions' default
# behavior) — a failed fetch/validate stops the pipeline before it ever
# touches the model, so a bad or empty pull can't silently retrain on
# nothing.
#
# Runs nightly at 18:00 UTC = 11:30pm IST, matching the existing Agmarknet
# pull window. workflow_dispatch lets us trigger it manually to test.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, validate, and store tonight's real prices
        id: fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The upstream data.gov.in API sometimes refuses connections from
          # Supabase's servers (ECONNREFUSED), which makes the function return
          # HTTP 500. That is transient, so retry a few times before giving up
          # instead of failing the whole night on the first refusal.
          for attempt in 1 2 3 4 5; do
            response=$(curl -s -m 170 -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/refresh-mandi-prices" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "Attempt $attempt - HTTP status: $http_code"
            echo "Response: $body"
            if [ "$http_code" = "200" ] && ! echo "$body" | grep -q '"error"'; then
              inserted_try=$(echo "$body" | grep -o '"inserted":[0-9]*' | grep -o '[0-9]*')
              if [ -n "$inserted_try" ] && [ "$inserted_try" -gt 0 ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt $attempt did not store any rows; retrying in 120s..."
              sleep 120
            fi
          done

          if [ "$http_code" != "200" ]; then
            echo "::error::refresh-mandi-prices returned HTTP $http_code — stopping the pipeline."
            exit 1
          fi
          if echo "$body" | grep -q '"error"'; then
            echo "::error::refresh-mandi-prices reported an error — stopping the pipeline."
            exit 1
          fi
          inserted=$(echo "$body" | grep -o '"inserted":[0-9]*' | grep -o '[0-9]*')
          if [ -z "$inserted" ] || [ "$inserted" -eq 0 ]; then
            echo "::error::0 rows inserted (likely rate-limited or no new data) — stopping before retraining on stale data."
            exit 1
          fi
          echo "Stored $inserted real price rows for tonight."

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install retrain dependencies
        run: pip install pandas scikit-learn requests numpy

      - name: Retrain and publish models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ml/retrain_nightly.py
